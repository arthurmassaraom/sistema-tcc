<article class="book-card">
    <div class="book-cover"><span>ACERVO<br>ABERTO</span><b>{{ livro.titulo[:1]|upper }}</b></div>
    <div class="book-info">
        <p class="eyebrow">{{ livro.genero }}</p>
        <h3>{{ livro.titulo }}</h3>
        <p>{{ livro.autor }}</p>
        <p class="muted">{{ livro.ano or "Ano não informado" }} · {{ livro.estoque }} disponível(is)</p><a
            class="text-link" href="{{ url_for('livros.catalogo', q=livro.titulo) }}">Saiba mais →</a>
    </div>
</article>
